disabled_rules:
  # SwiftUI uses these patterns extensively.
  - trailing_closure
  - multiple_closures_with_trailing_closure
  # SwiftFormat adds trailing commas; disabling here to avoid conflict.
  - trailing_comma
  # FolderLibrary is intentionally large.
  - file_length
  - type_body_length

opt_in_rules:
  - empty_count
  - force_unwrapping
  - implicitly_unwrapped_optional

line_length:
  warning: 120
  error: 200

identifier_name:
  excluded:
    - id   # Standard Identifiable protocol property.
    - op   # Idiomatic shorthand for Operation in OperationQueue code.
    - up   # Direction enum case.
